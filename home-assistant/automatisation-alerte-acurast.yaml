# Automatisation Home Assistant : reçoit les alertes du service de relevé
# (téléphone qui n'envoie plus de signal) et les envoie en notification sur votre téléphone.
#
# Installation : Paramètres > Automatisations et scènes > + Créer une automatisation >
# Créer une nouvelle automatisation > menu ⋮ en haut à droite > Modifier en YAML >
# tout remplacer par ce texte > Enregistrer.
#
# À adapter :
#   1. webhook_id : choisissez un identifiant difficile à deviner (ex. acurast-8f3a91c2d4e7b605)
#      et mettez la même adresse dans le tableau de bord : Réglages > Alertes Home Assistant
#      → http://<home-assistant>:8123/api/webhook/<webhook_id>
#   2. notify.mobile_app_VOTRE_TELEPHONE : le nom de votre téléphone dans Home Assistant
#      (Outils de développement > Actions > tapez « notify.mobile_app » pour voir la liste).
#   3. url : l'adresse du tableau de bord, ouverte quand vous touchez la notification.
alias: Alerte Acurast
description: Notifications envoyées par le service qui surveille les processors Acurast
mode: queued
triggers:
  - trigger: webhook
    webhook_id: acurast-CHANGEZ-MOI
    allowed_methods:
      - POST
    local_only: true
conditions: []
actions:
  - action: notify.mobile_app_VOTRE_TELEPHONE
    data:
      title: "{{ trigger.json.titre }}"
      message: "{{ trigger.json.message }}"
      data:
        url: http://IP_DU_RASPBERRY:8090/
        push:
          sound: default
          interruption-level: time-sensitive
